<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grand Hotel - Clientes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1419;color:#e8eef4;min-height:100vh}
header{background:#1a222d;border-bottom:1px solid #2d3a4a;padding:1.25rem 2rem}
header h1{font-size:1.4rem;font-weight:700}
header h1 span{color:#c9a227}
header p{color:#8fa3b8;font-size:.85rem;margin-top:.25rem}
main{max-width:900px;margin:2rem auto;padding:0 1rem}
.card{background:#1a222d;border:1px solid #2d3a4a;border-radius:12px;padding:1.5rem;margin-bottom:1.5rem}
.card h2{font-size:1rem;font-weight:600;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.field label{display:block;font-size:.75rem;font-weight:600;text-transform:uppercase;color:#8fa3b8;margin-bottom:.3rem}
.field input{width:100%;padding:.6rem .8rem;background:#0f1419;border:1px solid #2d3a4a;border-radius:8px;color:#e8eef4;font-size:.9rem}
.field input:focus{outline:none;border-color:#c9a227}
.btns{display:flex;gap:.5rem;margin-top:1rem}
button{border:none;border-radius:8px;padding:.55rem 1.1rem;font-size:.875rem;font-weight:600;cursor:pointer}
.btn-gold{background:#c9a227;color:#1a1408}
.btn-gold:hover{filter:brightness(1.1)}
.btn-gray{background:#232d3a;color:#8fa3b8;border:1px solid #2d3a4a}
.btn-gray:hover{color:#e8eef4}
.btn-red{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3);padding:.35rem .75rem;font-size:.8rem}
.btn-red:hover{background:rgba(248,113,113,.25)}
.btn-edit{background:rgba(201,162,39,.15);color:#c9a227;border:1px solid rgba(201,162,39,.3);padding:.35rem .75rem;font-size:.8rem}
.btn-edit:hover{background:rgba(201,162,39,.25)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.bar h2{margin:0}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{background:rgba(0,0,0,.3);color:#8fa3b8;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;padding:.65rem 1rem;text-align:left}
td{padding:.75rem 1rem;border-bottom:1px solid #232d3a}
tr:last-child td{border:none}
tbody tr:hover{background:#1e2a38}
.acts{display:flex;gap:.4rem}
.empty{text-align:center;padding:2.5rem;color:#8fa3b8}
.alerta{padding:.65rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.875rem;display:none}
.alerta.show{display:block}
.alerta.ok{background:rgba(61,214,140,.12);border:1px solid rgba(61,214,140,.3);color:#3dd68c}
.alerta.err{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);color:#f87171}
</style>
</head>
<body>

<header>
  <h1>Grand <span>Hotel</span></h1>
  <p>Gestión de Clientes · Frontend independiente · API: localhost:8080</p>
</header>

<main>
  <div id="alerta" class="alerta"></div>

  <!-- FORMULARIO -->
  <div class="card">
    <h2 id="form-titulo">Nuevo cliente</h2>
    <div class="grid">
      <div class="field"><label>Nombre</label><input id="nombre" placeholder="Nombre"/></div>
      <div class="field"><label>Apellido</label><input id="apellido" placeholder="Apellido"/></div>
      <div class="field"><label>Email</label><input id="email" type="email" placeholder="correo@email.com"/></div>
    </div>
    <div class="btns">
      <button class="btn-gold" onclick="guardar()">Guardar</button>
      <button class="btn-gray" onclick="limpiar()">Cancelar</button>
    </div>
  </div>

  <!-- TABLA -->
  <div class="card">
    <div class="bar">
      <h2>Lista de clientes</h2>
      <button class="btn-gray" onclick="cargar()">Actualizar</button>
    </div>
    <div id="tabla-wrap">
      <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Apellido</th><th>Email</th><th>Acciones</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">No hay clientes registrados.</div>
    </div>
  </div>
</main>

<script>
var API = "http://localhost:8080/api/clientes";
var editId = null;

function alerta(msg, tipo) {
  var el = document.getElementById("alerta");
  el.textContent = msg;
  el.className = "alerta show " + tipo;
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove("show"); }, 4000);
}

function esc(s) {
  if (s == null) return "";
  var d = document.createElement("div");
  d.textContent = String(s);
  return d.innerHTML;
}

async function api(method, url, body) {
  var opts = { method: method, headers: { "Content-Type": "application/json", "Accept": "application/json" } };
  if (body != null) opts.body = JSON.stringify(body);
  var res = await fetch(url, opts);
  var txt = await res.text();
  var data = null;
  if (txt) { try { data = JSON.parse(txt); } catch(e) { data = txt; } }
  if (!res.ok) {
    var m = (data && typeof data === "object" && (data.message || data.error)) || res.statusText || "Error " + res.status;
    throw new Error(m);
  }
  return data;
}

function limpiar() {
  editId = null;
  document.getElementById("nombre").value = "";
  document.getElementById("apellido").value = "";
  document.getElementById("email").value = "";
  document.getElementById("form-titulo").textContent = "Nuevo cliente";
}

function editar(id, nombre, apellido, email) {
  editId = id;
  document.getElementById("nombre").value = nombre;
  document.getElementById("apellido").value = apellido;
  document.getElementById("email").value = email;
  document.getElementById("form-titulo").textContent = "Editar cliente #" + id;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function guardar() {
  var nombre = document.getElementById("nombre").value.trim();
  var apellido = document.getElementById("apellido").value.trim();
  var email = document.getElementById("email").value.trim();
  if (!nombre || !apellido || !email) { alerta("Complete todos los campos", "err"); return; }
  var body = { nombre: nombre, apellido: apellido, email: email };
  try {
    if (editId != null) {
      body.id = editId;
      await api("PUT", API + "/" + editId, body);
      alerta("Cliente actualizado correctamente", "ok");
    } else {
      await api("POST", API, body);
      alerta("Cliente creado correctamente", "ok");
    }
    limpiar();
    cargar();
  } catch(e) { alerta("Error: " + e.message, "err"); }
}

async function eliminar(id) {
  if (!confirm("¿Eliminar cliente #" + id + "?")) return;
  try {
    await api("DELETE", API + "/" + id, null);
    alerta("Cliente eliminado", "ok");
    cargar();
  } catch(e) { alerta("Error: " + e.message, "err"); }
}

async function cargar() {
  try {
    var data = await api("GET", API, null);
    var list = Array.isArray(data) ? data : (data.content || []);
    var tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    document.getElementById("empty").style.display = list.length ? "none" : "block";
    list.forEach(function(c) {
      var tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + esc(c.id) + "</td>" +
        "<td>" + esc(c.nombre) + "</td>" +
        "<td>" + esc(c.apellido) + "</td>" +
        "<td>" + esc(c.email) + "</td>" +
        "<td class='acts'>" +
          "<button class='btn-edit' onclick='editar(" + c.id + ",\"" + esc(c.nombre) + "\",\"" + esc(c.apellido) + "\",\"" + esc(c.email) + "\")'>Editar</button>" +
          "<button class='btn-red' onclick='eliminar(" + c.id + ")'>Eliminar</button>" +
        "</td>";
      tbody.appendChild(tr);
    });
  } catch(e) { alerta("No se pudo conectar al backend: " + e.message, "err"); }
}

cargar();
</script>
</body>
</html>
